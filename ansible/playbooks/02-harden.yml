---
- name: Apply layered hardening baseline
  hosts: hardened_servers
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml

  pre_tasks:
    - name: Require Debian 12 or 13
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Debian"
          - ansible_distribution_major_version | int in [12, 13]
        fail_msg: >-
          This kit is validated on Debian 12/13. Other Debian-family distros
          need a porting pass before you trust the defaults.

    - name: Warn when inventory still targets root after bootstrap
      ansible.builtin.debug:
        msg: >-
          You are connected as root. Prefer inventories/lab/hosts.yml with
          ansible_user={{ harden_admin_user }} and ansible_port={{ harden_ssh_port }}.
      when: ansible_user | default('') == 'root'

    - name: Warn when Fail2Ban has no admin ignoreip allowlist
      ansible.builtin.debug:
        msg: >-
          harden_fail2ban_ignoreip is empty. A mistyped key or scan from your
          own IP can ban you. Set admin/VPN CIDRs before production runs
          (see profiles/prod.yml).
      when: (harden_fail2ban_ignoreip | default('') | trim) == ''

    - name: Require Fail2Ban ignoreip when enforced
      ansible.builtin.assert:
        that:
          - (harden_fail2ban_ignoreip | default('') | trim) | length > 0
        fail_msg: >-
          harden_fail2ban_require_ignoreip=true but harden_fail2ban_ignoreip is empty.
      when: harden_fail2ban_require_ignoreip | default(false) | bool

  roles:
    - role: bootstrap
      tags: [packages]
    - role: time_sync
      tags: [ntp, time]
    - role: host_sysctl
      tags: [sysctl]
    - role: ssh_hardening
      tags: [ssh]
    - role: ssh_mfa
      tags: [mfa]
      when: harden_enable_mfa_role | bool
    - role: password_policy
      tags: [passwords]
    - role: auto_updates
      tags: [updates]
    - role: firewall_stack
      tags: [firewall, ids]
    - role: outbound_mail
      tags: [mail]
    - role: malware_scan
      tags: [malware]
      when: harden_enable_clamav | bool
    - role: integrity_checks
      tags: [integrity]
      when: harden_enable_rkhunter | bool
    - role: rootkit_extra
      tags: [integrity, chkrootkit]
      when: harden_enable_chkrootkit | bool
    - role: file_integrity
      tags: [aide, integrity]
      when: harden_enable_aide | bool
    - role: audit_framework
      tags: [auditd]
    - role: log_digest
      tags: [logwatch]
      when: harden_enable_logwatch | bool
    - role: security_audit
      tags: [lynis]
