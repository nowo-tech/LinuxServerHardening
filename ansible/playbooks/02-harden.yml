---
- name: Apply layered hardening baseline
  hosts: hardened_servers
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml

  pre_tasks:
    - name: Require Debian 12 or 13
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Debian"
          - ansible_distribution_major_version | int in [12, 13]
        fail_msg: >-
          This kit is validated on Debian 12/13. Other Debian-family distros
          need a porting pass before you trust the defaults.

    - name: Require lab or prod profile overlay
      ansible.builtin.assert:
        that:
          - harden_profile is defined
          - harden_profile in ['lab', 'prod']
        fail_msg: >-
          Pass a profile overlay: -e @profiles/lab.yml (disposable) or
          -e @profiles/prod.yml (edit ignoreip first).

    - name: Refuse harden play as root unless explicitly allowed
      ansible.builtin.assert:
        that:
          - ansible_user | default('') != 'root'
        fail_msg: >-
          Harden expects the runtime inventory (admin user + hardened SSH port).
          Use hosts.yml after bootstrap, or set harden_allow_root_harden=true
          only for exceptional recovery.
      when: not (harden_allow_root_harden | default(false) | bool)

    - name: Refuse vault placeholder secrets
      ansible.builtin.assert:
        that:
          - vault_admin_password is defined
          - vault_admin_password | length > 0
          - "'CHANGE_ME' not in (vault_admin_password | string)"
          - vault_smtp_password is defined
          - vault_smtp_password | length > 0
          - "'CHANGE_ME' not in (vault_smtp_password | string)"
        fail_msg: >-
          Replace CHANGE_ME_* placeholders in group_vars/all/vault.yml
          (and re-encrypt with ansible-vault).

    - name: Require MFA role wired before enforcing MFA in sshd
      ansible.builtin.assert:
        that:
          - harden_enable_mfa_role | bool
          - not (harden_ssh_mfa_nullok | bool)
        fail_msg: >-
          harden_ssh_mfa_enable=true requires harden_enable_mfa_role=true and
          harden_ssh_mfa_nullok=false after every admin has enrolled TOTP.
      when: harden_ssh_mfa_enable | default(false) | bool

    - name: Warn when Fail2Ban has no admin ignoreip allowlist
      ansible.builtin.debug:
        msg: >-
          harden_fail2ban_ignoreip is empty. Use -e @profiles/lab.yml for
          disposable labs, or set real admin/VPN CIDRs (profiles/prod.yml).
      when: (harden_fail2ban_ignoreip | default('') | trim) == ''

    - name: Require Fail2Ban ignoreip outside lab relaxations
      ansible.builtin.assert:
        that:
          - (harden_fail2ban_ignoreip | default('') | trim) | length > 0
          - "'REPLACE_ME' not in (harden_fail2ban_ignoreip | default(''))"
          - "'203.0.113.' not in (harden_fail2ban_ignoreip | default(''))"
          - "'198.51.100.' not in (harden_fail2ban_ignoreip | default(''))"
          - "'192.0.2.' not in (harden_fail2ban_ignoreip | default(''))"
        fail_msg: >-
          harden_fail2ban_require_ignoreip=true but ignoreip is empty, still
          REPLACE_ME_*, or a documentation TEST-NET range. Set real CIDRs or
          pass -e @profiles/lab.yml for disposable VMs.
      when: harden_fail2ban_require_ignoreip | default(true) | bool

  roles:
    - role: bootstrap
      tags: [packages]
    - role: time_sync
      tags: [ntp, time]
    - role: host_sysctl
      tags: [sysctl]
    - role: ssh_hardening
      tags: [ssh]
    - role: ssh_mfa
      tags: [mfa]
      when: harden_enable_mfa_role | bool
    - role: password_policy
      tags: [passwords]
    - role: auto_updates
      tags: [updates]
    - role: firewall_stack
      tags: [firewall, ids]
    - role: outbound_mail
      tags: [mail]
    - role: malware_scan
      tags: [malware]
      when: harden_enable_clamav | bool
    - role: integrity_checks
      tags: [integrity]
      when: harden_enable_rkhunter | bool
    - role: rootkit_extra
      tags: [integrity, chkrootkit]
      when: harden_enable_chkrootkit | bool
    - role: file_integrity
      tags: [aide, integrity]
      when: harden_enable_aide | bool
    - role: audit_framework
      tags: [auditd]
    - role: log_digest
      tags: [logwatch]
      when: harden_enable_logwatch | bool
    - role: monitoring_stack
      tags: [monitoring, metrics, health, monit, node_exporter, health_watchdog]
    - role: deploy_agents
      tags: [deploy, runner, gha_runner, webhook_deploy]
    - role: security_audit
      tags: [lynis]
