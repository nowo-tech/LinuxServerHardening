---
- name: Apply layered hardening baseline
  hosts: hardened_servers
  become: true
  gather_facts: true
  remote_user: "{{ harden_admin_user }}"
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml

  roles:
    - role: bootstrap
      tags: [packages]
    - role: time_sync
      tags: [ntp, time]
    - role: host_sysctl
      tags: [sysctl]
    - role: ssh_hardening
      tags: [ssh]
    - role: ssh_mfa
      tags: [mfa]
      when: harden_enable_mfa_role | bool
    - role: password_policy
      tags: [passwords]
    - role: auto_updates
      tags: [updates]
    - role: firewall_stack
      tags: [firewall, ids]
    - role: outbound_mail
      tags: [mail]
    - role: malware_scan
      tags: [malware]
      when: harden_enable_clamav | bool
    - role: integrity_checks
      tags: [integrity]
      when: harden_enable_rkhunter | bool
    - role: rootkit_extra
      tags: [integrity, chkrootkit]
      when: harden_enable_chkrootkit | bool
    - role: file_integrity
      tags: [aide, integrity]
      when: harden_enable_aide | bool
    - role: audit_framework
      tags: [auditd]
    - role: log_digest
      tags: [logwatch]
      when: harden_enable_logwatch | bool
    - role: security_audit
      tags: [lynis]
