---
- name: Run security audit report
  hosts: hardened_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load non-secret variables when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/vars.yml"
      failed_when: false

    - name: Load vault when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/all/vault.yml"
      failed_when: false

    - name: Require mail recipient for report mailing
      ansible.builtin.assert:
        that:
          - harden_mail_to is defined
          - harden_mail_to | length > 0
        fail_msg: >-
          Set harden_mail_to in group_vars/all/vars.yml (or -e) before mailing Lynis reports.

  roles:
    - role: security_audit
      tags: [lynis]
      vars:
        harden_lynis_force_run: true
