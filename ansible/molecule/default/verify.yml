---
- name: Verify harden smoke including mail, MFA enforce, Lynis
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Check molecule user
      ansible.builtin.command: id molecule
      register: molecule_id
      changed_when: false

    - name: Assert sshaccess membership
      ansible.builtin.assert:
        that:
          - "'sshaccess' in molecule_id.stdout"

    - name: Assert sshd drop-in exists
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/10-nowo-hardening.conf
      register: sshd_dropin

    - name: Require drop-in
      ansible.builtin.assert:
        that:
          - sshd_dropin.stat.exists

    - name: Read sshd drop-in
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config.d/10-nowo-hardening.conf
      register: sshd_conf

    - name: MFA must be enforced after seeded enrolment
      ansible.builtin.assert:
        that:
          - "'AuthenticationMethods publickey,keyboard-interactive' in (sshd_conf.content | b64decode)"
          - "'KbdInteractiveAuthentication yes' in (sshd_conf.content | b64decode)"

    - name: Validate sshd config
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Assert sysctl drop-in exists
      ansible.builtin.stat:
        path: /etc/sysctl.d/60-nowo-hardening.conf
      register: sysctl_dropin

    - name: Require sysctl drop-in
      ansible.builtin.assert:
        that:
          - sysctl_dropin.stat.exists

    - name: Sysctl includes kptr_restrict
      ansible.builtin.command: grep -F 'kernel.kptr_restrict = 2' /etc/sysctl.d/60-nowo-hardening.conf
      changed_when: false

    - name: UFW must be active after firewall_stack
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false

    - name: Require UFW active
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"

    - name: After-chain PSAD LOG hooks present
      ansible.builtin.command: grep -F 'NOWO IPTABLES LOGGING' /etc/ufw/after.rules
      register: after_log
      changed_when: false

    - name: Require after.rules logging marker
      ansible.builtin.assert:
        that:
          - after_log.rc == 0

    - name: Legacy before-chain LOG hooks must be gone
      ansible.builtin.shell: |
        set -euo pipefail
        if grep -q 'NOWO IPTABLES LOGGING' /etc/ufw/before.rules 2>/dev/null; then
          exit 1
        fi
        exit 0
      args:
        executable: /bin/bash
      changed_when: false

    - name: Fail2Ban sshd jail present
      ansible.builtin.stat:
        path: /etc/fail2ban/jail.d/sshd-nowo.local
      register: f2b_jail

    - name: Require Fail2Ban jail
      ansible.builtin.assert:
        that:
          - f2b_jail.stat.exists

    - name: PAM TOTP enforced without nullok
      ansible.builtin.shell: |
        set -euo pipefail
        grep -E 'pam_google_authenticator\.so' /etc/pam.d/sshd | grep -vq nullok
      args:
        executable: /bin/bash
      changed_when: false

    - name: Seeded TOTP secret exists for molecule
      ansible.builtin.stat:
        path: /home/molecule/.google_authenticator
      register: totp_secret

    - name: Require TOTP secret 0400
      ansible.builtin.assert:
        that:
          - totp_secret.stat.exists
          - totp_secret.stat.mode == '0400'

    - name: msmtp config is root-only
      ansible.builtin.stat:
        path: /etc/msmtprc
      register: msmtprc

    - name: Require msmtp 0600
      ansible.builtin.assert:
        that:
          - msmtprc.stat.exists
          - msmtprc.stat.mode == '0600'

    - name: Mail path reached local SMTP sink
      ansible.builtin.command: grep -F 'LinuxServerHardening mail path' /var/log/nowo-smtp-sink.log
      changed_when: false

    - name: Lynis is installed from Debian (no third-party repo)
      ansible.builtin.command: dpkg -s lynis
      changed_when: false

    - name: Cisofy third-party list must stay absent
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/cisofy-lynis.list
      register: cisofy_list

    - name: Require no Cisofy source
      ansible.builtin.assert:
        that:
          - not cisofy_list.stat.exists

    - name: Lynis report produced by --quick audit
      ansible.builtin.stat:
        path: /var/log/lynis-report.dat
      register: lynis_report

    - name: Require Lynis report file
      ansible.builtin.assert:
        that:
          - lynis_report.stat.exists
        fail_msg: Expected /var/log/lynis-report.dat after harden_lynis_force_run

    - name: node_exporter package present
      ansible.builtin.command: dpkg -s prometheus-node-exporter
      changed_when: false

    - name: node_exporter is active
      ansible.builtin.command: systemctl is-active prometheus-node-exporter
      changed_when: false

    - name: node_exporter metrics endpoint responds locally
      ansible.builtin.command: curl -fsS --max-time 5 http://127.0.0.1:9100/metrics
      register: node_metrics
      changed_when: false

    - name: Require node metrics payload
      ansible.builtin.assert:
        that:
          - "'node_' in node_metrics.stdout"

    - name: Health watchdog script installed
      ansible.builtin.stat:
        path: /usr/local/sbin/nowo-health-watchdog
      register: watchdog

    - name: Require watchdog script and cron
      ansible.builtin.assert:
        that:
          - watchdog.stat.exists
          - watchdog.stat.mode == '0755'

    - name: Health watchdog cron present
      ansible.builtin.stat:
        path: /etc/cron.d/nowo-health-watchdog
      register: watchdog_cron

    - name: Require watchdog cron
      ansible.builtin.assert:
        that:
          - watchdog_cron.stat.exists

    - name: Monit package present
      ansible.builtin.command: dpkg -s monit
      changed_when: false

    - name: Monit is active
      ansible.builtin.command: systemctl is-active monit
      changed_when: false

    - name: Monit nowo config present
      ansible.builtin.stat:
        path: /etc/monit/conf.d/nowo-hardening
      register: monit_conf

    - name: Require Monit config
      ansible.builtin.assert:
        that:
          - monit_conf.stat.exists
