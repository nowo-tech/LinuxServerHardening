---
# Debian 13 Docker smoke: identity, SSH, staged MFA, UFW/IDS, msmtp, Lynis install.
# Requires: pip install molecule molecule-plugins[docker] ansible-core
# Run from ansible/: molecule test
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: debian13-harden
    # Pin digest for supply-chain stability (bump intentionally when refreshing)
    image: geerlingguy/docker-debian13-ansible@sha256:66663f77a975012e9da0ff3896d402a412db97c1db20b1cf703f3a6dd169ccf1
    pre_build_image: true
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          debian13-harden:
            ansible_user: root
  playbooks:
    converge: converge.yml
  env:
    ANSIBLE_ROLES_PATH: ../roles
verifier:
  name: ansible
scenario:
  name: default
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
