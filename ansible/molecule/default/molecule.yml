---
# Minimal Molecule skeleton for Debian converge smoke tests.
# Requires: pip install molecule molecule-plugins[docker] ansible-core
# Run from ansible/: molecule test
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: debian13-harden
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          debian13-harden:
            ansible_user: root
  playbooks:
    converge: converge.yml
  env:
    ANSIBLE_ROLES_PATH: ../roles
verifier:
  name: ansible
scenario:
  name: default
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
