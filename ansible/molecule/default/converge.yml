---
- name: Converge — identity, staged MFA, firewall, local SMTP, Lynis audit
  hosts: all
  become: true
  gather_facts: true
  vars:
    harden_profile: lab
    harden_allow_root_harden: true
    harden_admin_user: molecule
    harden_groups:
      ssh: sshaccess
      sudo: elevated
      su: switchroot
    harden_passwordless_sudo: true
    harden_ssh_public_key_path: "{{ playbook_dir }}/files/molecule.pub"
    harden_ssh_port: 2222
    harden_ssh_use_dns: "no"
    harden_ssh_mfa_enable: false
    harden_ssh_mfa_nullok: true
    harden_enable_mfa_role: true
    harden_fail2ban_require_ignoreip: false
    harden_fail2ban_ignoreip: "127.0.0.1"
    harden_strict_ops: false
    harden_enable_psad: true
    harden_enable_clamav: false
    harden_enable_rkhunter: false
    harden_enable_chkrootkit: false
    harden_enable_aide: false
    harden_enable_logwatch: false
    harden_lynis_force_run: true
    harden_enable_lynis_mail_report: false
    harden_allow_third_party_lynis_repo: false
    harden_mail_to: molecule@example.com
    harden_mail_from: molecule@example.com
    harden_smtp_host: 127.0.0.1
    harden_smtp_port: 2525
    harden_smtp_tls: false
    harden_smtp_auth: false
    harden_skip_mail_test: false
    harden_enable_node_exporter: true
    harden_node_exporter_listen: "127.0.0.1:9100"
    harden_node_exporter_ufw_allow: false
    harden_enable_health_watchdog: true
    harden_health_watchdog_mail: false
    harden_health_probe_urls: []
    harden_enable_monit: true
    harden_enable_gha_runner: false
    harden_enable_webhook_deploy: true
    harden_webhook_deploy_listen: "127.0.0.1:9000"
    harden_webhook_deploy_path: /hooks/deploy
    harden_webhook_deploy_repo_path: /var/www/app
    harden_webhook_deploy_branch: main
    harden_webhook_deploy_restart_service: ""
    harden_webhook_deploy_ufw_allow: false
    vault_admin_password: "MoleculeTestPassw0rd!"
    vault_smtp_password: "MoleculeSmtpPassw0rd!"
    vault_webhook_deploy_secret: "MoleculeWebhookSecret123!"
    vault_gha_runner_token: "CHANGE_ME_UNUSED"
    harden_packages:
      - ca-certificates
      - curl
      - fail2ban
      - libpam-google-authenticator
      - libpam-pwquality
      - lynis
      - mailutils
      - msmtp
      - msmtp-mta
      - openssh-server
      - psad
      - rsyslog
      - ufw
    harden_ufw_allow_out_ports:
      - { port: "53", proto: "any", comment: "DNS" }
      - { port: "80", proto: "tcp", comment: "HTTP" }
      - { port: "443", proto: "tcp", comment: "HTTPS" }
      - { port: "43", proto: "tcp", comment: "WHOIS" }
      - { port: "2525", proto: "tcp", comment: "Molecule SMTP sink" }
    harden_ufw_allow_in: []
  pre_tasks:
    - name: Install SMTP sink helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/smtp_sink.py"
        dest: /usr/local/bin/nowo-smtp-sink
        mode: "0755"

    - name: Start local SMTP sink on 127.0.0.1:2525
      ansible.builtin.shell: |
        set -euo pipefail
        if ! ss -ltn | grep -q ':2525 '; then
          nohup /usr/bin/python3 /usr/local/bin/nowo-smtp-sink --host 127.0.0.1 --port 2525 \
            >/var/log/nowo-smtp-sink.log 2>&1 &
          sleep 1
        fi
        ss -ltn | grep -q ':2525 '
      args:
        executable: /bin/bash
      changed_when: false

    - name: Seed a local git repo for webhook deploy
      ansible.builtin.shell: |
        set -euo pipefail
        apt-get install -y git >/dev/null
        rm -rf /tmp/nowo-src /var/www/app
        mkdir -p /tmp/nowo-src
        git -C /tmp/nowo-src init -b main
        git -C /tmp/nowo-src config user.email molecule@example.com
        git -C /tmp/nowo-src config user.name molecule
        echo 'hello' > /tmp/nowo-src/README.md
        git -C /tmp/nowo-src add README.md
        git -C /tmp/nowo-src commit -m 'init'
        git clone /tmp/nowo-src /var/www/app
      args:
        executable: /bin/bash
      changed_when: false
  roles:
    - role: bootstrap
    - role: admin_user
    - role: host_sysctl
    - role: password_policy
    - role: ssh_hardening
    - role: ssh_mfa
    - role: firewall_stack
    - role: outbound_mail
    - role: monitoring_stack
    - role: deploy_agents
    - role: security_audit

- name: Converge — enforce MFA after seeded TOTP enrolment
  hosts: all
  become: true
  gather_facts: false
  vars:
    harden_admin_user: molecule
    harden_groups:
      ssh: sshaccess
      sudo: elevated
      su: switchroot
    harden_ssh_port: 2222
    harden_ssh_use_dns: "no"
    harden_ssh_max_auth_tries: 3
    harden_ssh_max_sessions: 3
    harden_ssh_max_startups: "10:30:60"
    harden_enable_mfa_role: true
    harden_ssh_mfa_enable: true
    harden_ssh_mfa_nullok: false
  pre_tasks:
    - name: Seed google-authenticator secret for molecule (non-interactive enrolment)
      ansible.builtin.copy:
        dest: /home/molecule/.google_authenticator
        owner: molecule
        group: molecule
        mode: "0400"
        # Base32 secret "Hello!" — disposable Molecule fixture only
        content: |
          JBSWY3DPEHPK3PXP
          " RATE_LIMIT 3 30
          " WINDOW_SIZE 17
          " DISALLOW_REUSE
          " TOTP_AUTH
  roles:
    - role: ssh_hardening
    - role: ssh_mfa

- name: Converge — prove monitoring disable uninstalls idempotently
  hosts: all
  become: true
  gather_facts: false
  vars:
    harden_enable_node_exporter: false
    harden_enable_health_watchdog: false
    harden_enable_monit: false
    harden_node_exporter_listen: "127.0.0.1:9100"
    harden_node_exporter_ufw_allow: false
    harden_node_exporter_allow_from:
      - any
    harden_mail_to: molecule@example.com
    harden_mail_from: molecule@example.com
    harden_smtp_host: 127.0.0.1
    harden_smtp_port: 2525
    harden_smtp_tls: false
    harden_smtp_auth: false
    vault_smtp_password: "MoleculeSmtpPassw0rd!"
    harden_ssh_port: 2222
  roles:
    - role: monitoring_stack
  tasks:
    - name: node_exporter must be removed
      ansible.builtin.command: dpkg -s prometheus-node-exporter
      register: ne_pkg
      changed_when: false
      failed_when: ne_pkg.rc == 0

    - name: Watchdog script must be absent
      ansible.builtin.stat:
        path: /usr/local/sbin/nowo-health-watchdog
      register: wd

    - name: Require watchdog gone
      ansible.builtin.assert:
        that:
          - not wd.stat.exists

    - name: Monit must be removed
      ansible.builtin.command: dpkg -s monit
      register: monit_pkg
      changed_when: false
      failed_when: monit_pkg.rc == 0

- name: Converge — re-enable monitoring for final verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    harden_enable_node_exporter: true
    harden_node_exporter_listen: "127.0.0.1:9100"
    harden_node_exporter_ufw_allow: false
    harden_enable_health_watchdog: true
    harden_health_watchdog_mail: false
    harden_health_probe_urls: []
    harden_enable_monit: true
    harden_mail_to: molecule@example.com
    harden_mail_from: molecule@example.com
    harden_smtp_host: 127.0.0.1
    harden_smtp_port: 2525
    harden_smtp_tls: false
    harden_smtp_auth: false
    vault_smtp_password: "MoleculeSmtpPassw0rd!"
    harden_ssh_port: 2222
  roles:
    - role: monitoring_stack

- name: Converge — prove webhook deploy disable uninstalls idempotently
  hosts: all
  become: true
  gather_facts: false
  vars:
    harden_enable_gha_runner: false
    harden_enable_webhook_deploy: false
    harden_webhook_deploy_listen: "127.0.0.1:9000"
    harden_webhook_deploy_allow_from:
      - any
    harden_webhook_deploy_ufw_allow: false
  roles:
    - role: deploy_agents
  tasks:
    - name: Webhook unit must be absent
      ansible.builtin.stat:
        path: /etc/systemd/system/nowo-webhook-deploy.service
      register: wh

    - name: Require webhook gone
      ansible.builtin.assert:
        that:
          - not wh.stat.exists

- name: Converge — re-enable webhook deploy for final verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    harden_enable_gha_runner: false
    harden_enable_webhook_deploy: true
    harden_webhook_deploy_listen: "127.0.0.1:9000"
    harden_webhook_deploy_path: /hooks/deploy
    harden_webhook_deploy_repo_path: /var/www/app
    harden_webhook_deploy_branch: main
    harden_webhook_deploy_restart_service: ""
    harden_webhook_deploy_ufw_allow: false
    vault_webhook_deploy_secret: "MoleculeWebhookSecret123!"
  roles:
    - role: deploy_agents
