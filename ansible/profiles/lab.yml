---
# Lab overlay — disposable VMs only
#   ansible-playbook ... -e @profiles/lab.yml

harden_profile: lab
harden_passwordless_sudo: true
harden_auto_reboot: true
harden_enable_clamav: true
harden_enable_aide: true
harden_enable_chkrootkit: true
harden_enable_logwatch: true
harden_psad_auto_ids: false
# Lab may run without a fixed admin CIDR
harden_fail2ban_require_ignoreip: false
harden_strict_ops: false
# Optional monitoring — false on next run uninstalls/stops idempotently
harden_enable_node_exporter: true
harden_enable_health_watchdog: true
harden_enable_monit: true
# Deploy agents need tokens/secrets — leave off until configured
harden_enable_gha_runner: false
harden_enable_webhook_deploy: false
