---
# Production overlay — replace placeholders before use
#   ansible-playbook ... -e @profiles/prod.yml

harden_profile: prod
harden_passwordless_sudo: false
harden_auto_reboot: false
harden_psad_auto_ids: false
harden_enable_clamav: false
harden_enable_aide: false
harden_enable_chkrootkit: false
harden_enable_mfa_role: false
harden_ssh_mfa_enable: false
harden_allow_third_party_lynis_repo: false
harden_lynis_force_run: false
harden_strict_ops: true
harden_fail2ban_require_ignoreip: true
# REQUIRED: real admin/VPN CIDRs (not TEST-NET / documentation ranges)
harden_fail2ban_ignoreip: "REPLACE_ME_ADMIN_CIDR"
harden_ssh_keys_exclusive: true
harden_ssh_use_dns: "no"
# Monitoring opt-in (false = ensure stopped/removed)
harden_enable_node_exporter: false
harden_enable_health_watchdog: false
harden_enable_monit: false
