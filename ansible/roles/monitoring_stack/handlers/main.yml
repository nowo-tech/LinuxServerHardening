---
- name: Restart prometheus-node-exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: restarted

- name: Reload monit
  ansible.builtin.service:
    name: monit
    state: reloaded

- name: Reload ufw
  ansible.builtin.shell: |
    set -euo pipefail
    if ufw status 2>/dev/null | head -n1 | grep -qi 'Status: active'; then
      ufw reload
    fi
  args:
    executable: /bin/bash
  changed_when: false
