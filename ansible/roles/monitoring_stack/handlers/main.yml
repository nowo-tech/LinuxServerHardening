---
- name: Restart prometheus-node-exporter
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: restarted

- name: Reload monit
  ansible.builtin.service:
    name: monit
    state: reloaded

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload systemd and enable health watchdog timer
  ansible.builtin.systemd:
    name: nowo-health-watchdog.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Reload ufw
  ansible.builtin.shell: |
    set -euo pipefail
    if ufw status 2>/dev/null | head -n1 | grep -qi 'Status: active'; then
      ufw reload
    fi
  args:
    executable: /bin/bash
  changed_when: false
