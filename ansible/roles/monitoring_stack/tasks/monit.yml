---
- name: Install or remove monit
  ansible.builtin.apt:
    name: monit
    state: "{{ 'present' if (harden_enable_monit | default(false) | bool) else 'absent' }}"
    purge: "{{ not (harden_enable_monit | default(false) | bool) }}"
    autoremove: "{{ not (harden_enable_monit | default(false) | bool) }}"

- name: Deploy Monit baseline checks
  when: harden_enable_monit | default(false) | bool
  ansible.builtin.copy:
    dest: /etc/monit/conf.d/nowo-hardening
    mode: "0644"
    content: |
      # Managed by LinuxServerHardening — keep checks cheap and local
      set daemon {{ harden_monit_daemon_seconds | default(120) | int }}
      set logfile /var/log/monit.log

      check system $HOST
        if loadavg (1min) > {{ harden_monit_load_1min | default(8) | int }} for 5 cycles then alert
        if memory usage > {{ harden_monit_memory_pct | default(90) | int }}% for 5 cycles then alert
        if cpu usage > {{ harden_monit_cpu_pct | default(95) | int }}% for 5 cycles then alert

      check filesystem rootfs with path /
        if space usage > {{ harden_health_disk_threshold_pct | default(90) | int }}% then alert

      check process sshd with matching "sshd"
        start program = "/bin/systemctl start ssh"
        stop program  = "/bin/systemctl stop ssh"
        if failed port {{ harden_ssh_port | default(22) }} type tcp protocol ssh then alert

      {% if harden_enable_node_exporter | default(false) | bool %}
      check process node_exporter with matching "prometheus-node-exporter"
        start program = "/bin/systemctl start prometheus-node-exporter"
        stop program  = "/bin/systemctl stop prometheus-node-exporter"
        if failed host 127.0.0.1 port {{ (harden_node_exporter_listen | default('127.0.0.1:9100')).split(':')[-1] }} protocol http then alert
      {% endif %}
  notify: Reload monit

- name: Configure Monit SMTP alerts
  when: harden_enable_monit | default(false) | bool
  ansible.builtin.copy:
    dest: /etc/monit/conf.d/nowo-mail
    mode: "0600"
    content: |
      set mailserver {{ harden_smtp_host }} port {{ harden_smtp_port }}
      {%- if harden_smtp_auth | default(true) | bool %}
        username "{{ harden_mail_from }}" password "{{ vault_smtp_password }}"
      {%- endif %}
      {%- if harden_smtp_tls | default(true) | bool %}
        using tlsv12
      {%- endif %}
        with timeout 15 seconds
      set alert {{ harden_mail_to }}
  no_log: true
  notify: Reload monit

- name: Ensure Monit is started and enabled
  when: harden_enable_monit | default(false) | bool
  ansible.builtin.service:
    name: monit
    state: started
    enabled: true

- name: Validate Monit configuration
  when: harden_enable_monit | default(false) | bool
  ansible.builtin.command: monit -t
  changed_when: false

- name: Remove Monit drop-ins when disabled
  when: not (harden_enable_monit | default(false) | bool)
  block:
    - name: Remove nowo Monit configs
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/monit/conf.d/nowo-hardening
        - /etc/monit/conf.d/nowo-mail

    - name: Check whether monit unit exists
      ansible.builtin.stat:
        path: /lib/systemd/system/monit.service
      register: monit_unit

    - name: Stop Monit before purge completes
      when: monit_unit.stat.exists
      ansible.builtin.service:
        name: monit
        state: stopped
        enabled: false
      failed_when: false
