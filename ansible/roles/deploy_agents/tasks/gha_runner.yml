---
- name: Require registration token and tarball checksum when enabling GHA runner
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.assert:
    that:
      - vault_gha_runner_token is defined
      - vault_gha_runner_token | length > 0
      - "'CHANGE_ME' not in (vault_gha_runner_token | string)"
      - harden_gha_runner_url is defined
      - harden_gha_runner_url | length > 0
      - "'REPLACE_ME' not in (harden_gha_runner_url | string)"
      - harden_gha_runner_checksum is defined
      - harden_gha_runner_checksum | length > 0
      - harden_gha_runner_checksum is match('^sha256:[0-9a-fA-F]{64}$')
    fail_msg: >-
      harden_enable_gha_runner=true needs harden_gha_runner_url, vault_gha_runner_token,
      and harden_gha_runner_checksum (sha256:<64 hex>) for supply-chain integrity.

- name: Install GHA runner dependencies
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.apt:
    name:
      - curl
      - tar
      - jq
      - ca-certificates
    state: present

- name: Create GHA runner system user
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.user:
    name: "{{ harden_gha_runner_user | default('gha-runner') }}"
    system: true
    create_home: true
    home: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}"
    shell: /usr/sbin/nologin
    state: present

- name: Ensure GHA runner home exists
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.file:
    path: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}"
    state: directory
    owner: "{{ harden_gha_runner_user | default('gha-runner') }}"
    group: "{{ harden_gha_runner_user | default('gha-runner') }}"
    mode: "0750"

- name: Download GitHub Actions runner tarball
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.get_url:
    url: >-
      https://github.com/actions/runner/releases/download/v{{ harden_gha_runner_version }}/actions-runner-linux-{{ harden_gha_runner_arch | default('x64') }}-{{ harden_gha_runner_version }}.tar.gz
    dest: "/tmp/actions-runner-{{ harden_gha_runner_version }}.tar.gz"
    mode: "0644"
    checksum: "{{ harden_gha_runner_checksum }}"

- name: Check whether runner binaries are already extracted
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.stat:
    path: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}/run.sh"
  register: gha_run_sh

- name: Read installed runner version stamp
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.slurp:
    src: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}/.nowo-runner-version"
  register: gha_ver_stamp
  failed_when: false

- name: Extract Actions runner when missing or version changed
  when:
    - harden_enable_gha_runner | default(false) | bool
    - >-
      (not gha_run_sh.stat.exists)
      or (gha_ver_stamp.content is not defined)
      or ((gha_ver_stamp.content | default('') | b64decode | trim) != (harden_gha_runner_version | string))
  ansible.builtin.unarchive:
    src: "/tmp/actions-runner-{{ harden_gha_runner_version }}.tar.gz"
    dest: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}"
    remote_src: true
    owner: "{{ harden_gha_runner_user | default('gha-runner') }}"
    group: "{{ harden_gha_runner_user | default('gha-runner') }}"

- name: Install runner OS libraries (official helper)
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.command: ./bin/installdependencies.sh
  args:
    chdir: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}"
  register: gha_deps
  changed_when: false
  failed_when: gha_deps.rc | default(1) != 0

- name: Write runner version stamp
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.copy:
    dest: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}/.nowo-runner-version"
    content: "{{ harden_gha_runner_version }}\n"
    owner: "{{ harden_gha_runner_user | default('gha-runner') }}"
    group: "{{ harden_gha_runner_user | default('gha-runner') }}"
    mode: "0640"

- name: Remove temporary runner tarball
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.file:
    path: "/tmp/actions-runner-{{ harden_gha_runner_version }}.tar.gz"
    state: absent

- name: Check whether runner is already configured
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.stat:
    path: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}/.runner"
  register: gha_configured

- name: Stage registration token to a root-only file (avoid Vault echo in argv from Ansible)
  when:
    - harden_enable_gha_runner | default(false) | bool
    - not gha_configured.stat.exists
  ansible.builtin.copy:
    dest: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}/.nowo-reg-token"
    content: "{{ vault_gha_runner_token }}"
    owner: "{{ harden_gha_runner_user | default('gha-runner') }}"
    group: "{{ harden_gha_runner_user | default('gha-runner') }}"
    mode: "0600"
  no_log: true

- name: Register GitHub Actions runner (once; token read from file)
  when:
    - harden_enable_gha_runner | default(false) | bool
    - not gha_configured.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    TOKEN="$(cat .nowo-reg-token)"
    ./config.sh --unattended \
      --url {{ harden_gha_runner_url | quote }} \
      --token "${TOKEN}" \
      --name {{ ((harden_gha_runner_name | default('')) | length > 0) | ternary(harden_gha_runner_name, inventory_hostname) | quote }} \
      --labels {{ harden_gha_runner_labels | default('self-hosted,linux,debian') | quote }} \
      --work _work \
      --replace
  args:
    chdir: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}"
    executable: /bin/bash
  become: true
  become_user: "{{ harden_gha_runner_user | default('gha-runner') }}"
  no_log: true
  register: gha_register
  changed_when: gha_register.rc == 0

- name: Shred registration token file after register attempt
  when:
    - harden_enable_gha_runner | default(false) | bool
  ansible.builtin.file:
    path: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}/.nowo-reg-token"
    state: absent
  no_log: true

- name: Install systemd unit for GHA runner
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.copy:
    dest: /etc/systemd/system/actions.runner.nowo.service
    mode: "0644"
    content: |
      [Unit]
      Description=GitHub Actions Runner (Nowo)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ harden_gha_runner_user | default('gha-runner') }}
      WorkingDirectory={{ harden_gha_runner_home | default('/opt/actions-runner') }}
      ExecStart={{ harden_gha_runner_home | default('/opt/actions-runner') }}/run.sh
      Restart=always
      RestartSec=10
      KillMode=process
      KillSignal=SIGTERM
      TimeoutStopSec=5min
      # Conservative sandbox — relax if jobs need Docker/privileged helpers
      PrivateTmp=true
      ProtectHome=true
      ProtectSystem=full
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      NoNewPrivileges=true
      RestrictSUIDSGID=true
      LockPersonality=true
      SystemCallArchitectures=native
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
      UMask=027

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd and restart gha runner

- name: Enable and start GHA runner service
  when: harden_enable_gha_runner | default(false) | bool
  ansible.builtin.systemd:
    name: actions.runner.nowo
    state: started
    enabled: true
    daemon_reload: true

- name: Tear down GHA runner when disabled
  when: not (harden_enable_gha_runner | default(false) | bool)
  block:
    - name: Check GHA systemd unit
      ansible.builtin.stat:
        path: /etc/systemd/system/actions.runner.nowo.service
      register: gha_unit

    - name: Stop GHA runner service
      when: gha_unit.stat.exists
      ansible.builtin.systemd:
        name: actions.runner.nowo
        state: stopped
        enabled: false
      failed_when: false

    - name: Check runner config for removal
      ansible.builtin.stat:
        path: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}/.runner"
      register: gha_cfg_rm

    - name: Require a removal token when unregister is mandatory
      when:
        - gha_cfg_rm.stat.exists
        - harden_gha_runner_require_unregister | default(true) | bool
      ansible.builtin.assert:
        that:
          - vault_gha_runner_token is defined
          - vault_gha_runner_token | length > 0
          - "'CHANGE_ME' not in (vault_gha_runner_token | string)"
        fail_msg: >-
          Runner still registered (.runner present). Set a valid vault_gha_runner_token
          to unregister, or set harden_gha_runner_require_unregister=false to purge locally
          and leave an orphaned runner in GitHub.

    - name: Stage removal token file
      when:
        - gha_cfg_rm.stat.exists
        - vault_gha_runner_token is defined
        - vault_gha_runner_token | length > 0
        - "'CHANGE_ME' not in (vault_gha_runner_token | string)"
      ansible.builtin.copy:
        dest: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}/.nowo-reg-token"
        content: "{{ vault_gha_runner_token }}"
        owner: "{{ harden_gha_runner_user | default('gha-runner') }}"
        group: "{{ harden_gha_runner_user | default('gha-runner') }}"
        mode: "0600"
      no_log: true

    - name: Unregister runner from GitHub
      when:
        - gha_cfg_rm.stat.exists
        - vault_gha_runner_token is defined
        - vault_gha_runner_token | length > 0
        - "'CHANGE_ME' not in (vault_gha_runner_token | string)"
      ansible.builtin.shell: |
        set -euo pipefail
        TOKEN="$(cat .nowo-reg-token)"
        ./config.sh remove --token "${TOKEN}"
      args:
        chdir: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}"
        executable: /bin/bash
      become: true
      become_user: "{{ harden_gha_runner_user | default('gha-runner') }}"
      no_log: true
      register: gha_unregister
      failed_when: >-
        (harden_gha_runner_require_unregister | default(true) | bool)
        and (gha_unregister.rc | default(1) != 0)
      changed_when: gha_unregister.rc | default(1) == 0

    - name: Shred removal token file
      ansible.builtin.file:
        path: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}/.nowo-reg-token"
        state: absent
      no_log: true
      failed_when: false

    - name: Remove GHA systemd unit
      ansible.builtin.file:
        path: /etc/systemd/system/actions.runner.nowo.service
        state: absent
      notify: Reload systemd daemon

    - name: Remove GHA runner install directory
      when: harden_gha_runner_purge_home | default(true) | bool
      ansible.builtin.file:
        path: "{{ harden_gha_runner_home | default('/opt/actions-runner') }}"
        state: absent

    - name: Remove GHA runner user
      when: harden_gha_runner_purge_user | default(false) | bool
      ansible.builtin.user:
        name: "{{ harden_gha_runner_user | default('gha-runner') }}"
        state: absent
        remove: true
