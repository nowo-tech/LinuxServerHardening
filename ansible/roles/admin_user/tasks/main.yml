---
- name: Create intent-based groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop:
    - "{{ harden_groups.ssh }}"
    - "{{ harden_groups.sudo }}"
    - "{{ harden_groups.su }}"

- name: Create admin user
  ansible.builtin.user:
    name: "{{ harden_admin_user }}"
    groups: "{{ harden_groups.ssh }},{{ harden_groups.sudo }},{{ harden_groups.su }}"
    append: true
    shell: /bin/bash
    create_home: true
    password: "{{ vault_admin_password | password_hash('sha512') }}"
    state: present

- name: Install admin authorized_keys
  ansible.posix.authorized_key:
    user: "{{ harden_admin_user }}"
    key: "{{ lookup('file', harden_ssh_public_key_path | expanduser) }}"
    state: present
    exclusive: false

- name: Allow elevated group to sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-elevated
    mode: "0440"
    owner: root
    group: root
    content: |
      {% if harden_passwordless_sudo %}
      %{{ harden_groups.sudo }} ALL=(ALL:ALL) NOPASSWD:ALL
      {% else %}
      %{{ harden_groups.sudo }} ALL=(ALL:ALL) ALL
      {% endif %}
    validate: "visudo -cf %s"

- name: Restrict su to switchroot group via pam_wheel
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?auth\s+required\s+pam_wheel\.so'
    line: "auth       required   pam_wheel.so group={{ harden_groups.su }}"
    state: present
