---
- name: Render msmtp configuration
  ansible.builtin.template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    mode: "0600"
    owner: root
    group: root
  no_log: true

- name: Ensure msmtp logfile exists with tight permissions
  ansible.builtin.file:
    path: /var/log/msmtp.log
    state: touch
    mode: "0600"
    owner: root
    group: root
    modification_time: preserve
    access_time: preserve

- name: Map root mail to alert inbox
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: '^root:'
    line: "root: {{ harden_mail_to }}"
    create: true
  notify: Rebuild aliases

- name: Map default alias
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: '^default:'
    line: "default: {{ harden_mail_to }}"
    create: true
  notify: Rebuild aliases

- name: Point mail(1) at msmtp
  ansible.builtin.lineinfile:
    path: /etc/mail.rc
    regexp: '^set sendmail'
    line: 'set sendmail="/usr/bin/msmtp -t"'
    create: true

- name: Flush handlers so aliases rebuild before the test mail
  ansible.builtin.meta: flush_handlers

- name: Send bootstrap test message
  when: not (harden_skip_mail_test | default(false) | bool)
  ansible.builtin.command: >
    mail -s "[{{ ansible_hostname }}] mail path ok" {{ harden_mail_to }}
  args:
    stdin: "LinuxServerHardening mail path is working on {{ ansible_hostname }}"
  register: mail_test
  changed_when: false
  failed_when: >-
    (harden_strict_ops | default(true) | bool) and (mail_test.rc | default(1) != 0)
  check_mode: false

- name: Note skipped live mail test
  when: harden_skip_mail_test | default(false) | bool
  ansible.builtin.debug:
    msg: >-
      harden_skip_mail_test=true — msmtp config rendered but no message sent.
      Use a reachable SMTP host (or Molecule smtp_sink) to exercise the path.

- name: Surface mail test outcome
  ansible.builtin.debug:
    msg: >-
      Test mail exit code {{ mail_test.rc }}.
      If non-zero, fix SMTP/Vault/UFW outbound before trusting IDS alerts.
  when:
    - not (harden_skip_mail_test | default(false) | bool)
    - not (harden_strict_ops | default(true) | bool)
    - mail_test is defined
