---
- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Enable "1";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure security-only unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52nowo-unattended-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-security";
          "origin=Debian,codename=${distro_codename},label=Debian-Security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::InstallOnShutdown "false";
      Unattended-Upgrade::Mail "{{ harden_mail_to }}";
      Unattended-Upgrade::MailOnlyOnError "false";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "{{ harden_auto_reboot | default(false) | ternary('true', 'false') }}";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "{{ harden_auto_reboot | default(false) | ternary('true', 'false') }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ harden_auto_reboot_time | default('04:30') }}";

- name: Point apticron reports at the alert inbox
  ansible.builtin.lineinfile:
    path: /etc/apticron/apticron.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: true
  loop:
    - { regexp: '^EMAIL=', line: 'EMAIL="{{ harden_mail_to }}"' }
    - { regexp: '^NOTIFY_NO_UPDATES=', line: 'NOTIFY_NO_UPDATES="1"' }

- name: Prefer HTML apt-listchanges mail when MTA exists
  ansible.builtin.lineinfile:
    path: /etc/apt/listchanges.conf
    regexp: '^frontend='
    line: 'frontend=pager'
    create: true
  failed_when: false
