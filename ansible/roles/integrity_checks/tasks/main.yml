---
- name: Configure rkhunter defaults
  ansible.builtin.lineinfile:
    path: /etc/default/rkhunter
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^CRON_DAILY_RUN=', line: 'CRON_DAILY_RUN="true"' }
    - { regexp: '^CRON_DB_UPDATE=', line: 'CRON_DB_UPDATE="true"' }
    - { regexp: '^APT_AUTOGEN=', line: 'APT_AUTOGEN="true"' }
    - { regexp: '^REPORT_EMAIL=', line: 'REPORT_EMAIL="root"' }

- name: Tune rkhunter.conf reporting
  ansible.builtin.lineinfile:
    path: /etc/rkhunter.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^MAIL-ON-WARNING=', line: "MAIL-ON-WARNING={{ harden_mail_to }}" }
    - { regexp: '^COPY_LOG_ON_ERROR=', line: 'COPY_LOG_ON_ERROR=1' }
    - { regexp: '^USE_LOCKING=', line: 'USE_LOCKING=1' }
    - { regexp: '^WEB_CMD=', line: 'WEB_CMD=""' }

- name: Update rkhunter database and file properties
  ansible.builtin.shell: |
    set -euo pipefail
    rkhunter --update || true
    rkhunter --propupd
  args:
    executable: /bin/bash
  changed_when: false
