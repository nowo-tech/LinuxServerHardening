---
- name: Reload ssh
  ansible.builtin.service:
    name: ssh
    state: reloaded

# Skip reload when UFW is inactive (rules are queued until enable in firewall_stack)
- name: Reload ufw
  ansible.builtin.shell: |
    set -euo pipefail
    if ufw status 2>/dev/null | head -n1 | grep -qi 'Status: active'; then
      ufw reload
    fi
  args:
    executable: /bin/bash
  changed_when: false
