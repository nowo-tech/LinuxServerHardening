---
- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default deny outgoing
  community.general.ufw:
    direction: outgoing
    policy: deny

- name: Rate-limit SSH on the hardened port
  community.general.ufw:
    rule: limit
    port: "{{ harden_ssh_port }}"
    proto: tcp
    comment: SSH

- name: Allow required outbound ports
  community.general.ufw:
    rule: allow
    direction: out
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ harden_ufw_allow_out_ports }}"

- name: Allow explicit inbound application ports
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ harden_ufw_allow_in }}"

- name: Enable UFW logging and firewall
  community.general.ufw:
    state: enabled
    logging: "on"
  notify: Reload ufw

- name: Log traffic in UFW before.rules for IDS consumers
  ansible.builtin.blockinfile:
    path: /etc/ufw/before.rules
    insertbefore: "^COMMIT"
    marker: "# {mark} NOWO IPTABLES LOGGING"
    block: |
      # Rate-limited so PSAD gets signal without filling the disk
      -A INPUT -m limit --limit 2/min --limit-burst 5 -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
      -A FORWARD -m limit --limit 2/min --limit-burst 5 -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
  notify: Reload ufw

- name: Log traffic in UFW before6.rules for IDS consumers
  ansible.builtin.blockinfile:
    path: /etc/ufw/before6.rules
    insertbefore: "^COMMIT"
    marker: "# {mark} NOWO IPTABLES LOGGING"
    block: |
      -A INPUT -m limit --limit 2/min --limit-burst 5 -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
      -A FORWARD -m limit --limit 2/min --limit-burst 5 -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
  notify: Reload ufw

- name: Route iptables-tagged logs to a dedicated file
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/10-nowo-iptables.conf
    mode: "0644"
    content: |
      :msg, contains, "[IPTABLES] " /var/log/iptables.log
      & stop
  notify: Restart rsyslog

- name: Rotate dedicated iptables log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/nowo-iptables
    mode: "0644"
    content: |
      /var/log/iptables.log {
          daily
          rotate 7
          missingok
          notifempty
          compress
          delaycompress
          create 640 root adm
          postrotate
              /usr/lib/rsyslog/rsyslog-rotate >/dev/null 2>&1 || true
          endscript
      }

- name: Install Fail2Ban jail for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd-nowo.local
    mode: "0644"
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1 {{ harden_fail2ban_ignoreip | default('') }}
      bantime  = {{ harden_fail2ban_bantime }}
      findtime = 10m
      maxretry = {{ harden_fail2ban_maxretry }}
      destemail = {{ harden_mail_to }}
      sender = {{ harden_mail_from }}
      mta = mail
      action = %(action_mwl)s

      [sshd]
      enabled = true
      port = {{ harden_ssh_port }}
      backend = systemd
      banaction = ufw
  notify: Restart fail2ban

- name: Ensure Fail2Ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Configure PSAD basics
  when: harden_enable_psad | bool
  ansible.builtin.lineinfile:
    path: /etc/psad/psad.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^EMAIL_ADDRESSES', line: "EMAIL_ADDRESSES {{ harden_mail_to }};" }
    - { regexp: '^HOSTNAME', line: "HOSTNAME {{ ansible_hostname }};" }
    - { regexp: '^ENABLE_PSADWATCHD', line: "ENABLE_PSADWATCHD Y;" }
    - { regexp: '^ENABLE_AUTO_IDS ', line: "ENABLE_AUTO_IDS {{ 'Y' if harden_psad_auto_ids | bool else 'N' }};" }
    - { regexp: '^ENABLE_AUTO_IDS_EMAILS', line: "ENABLE_AUTO_IDS_EMAILS {{ 'Y' if harden_psad_auto_ids | bool else 'N' }};" }
    - { regexp: '^AUTO_IDS_DANGER_LEVEL', line: "AUTO_IDS_DANGER_LEVEL {{ harden_psad_danger_level }};" }
    - { regexp: '^EXPECT_TCP_OPTIONS', line: "EXPECT_TCP_OPTIONS Y;" }
    - { regexp: '^IPT_SYSLOG_FILE', line: "IPT_SYSLOG_FILE /var/log/iptables.log;" }
  notify: Restart psad

- name: Refresh PSAD signatures
  when: harden_enable_psad | bool
  ansible.builtin.command: psad --sig-update
  register: psad_sig
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure PSAD is running
  when: harden_enable_psad | bool
  ansible.builtin.service:
    name: psad
    state: started
    enabled: true
