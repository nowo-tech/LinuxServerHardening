---
- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default deny outgoing
  community.general.ufw:
    direction: outgoing
    policy: deny

- name: Rate-limit SSH on the hardened port
  community.general.ufw:
    rule: limit
    port: "{{ harden_ssh_port }}"
    proto: tcp
    comment: SSH

- name: Allow required outbound ports
  community.general.ufw:
    rule: allow
    direction: out
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ harden_ufw_allow_out_ports }}"

- name: Allow explicit inbound application ports
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ harden_ufw_allow_in }}"

- name: Enable UFW logging and firewall
  community.general.ufw:
    state: enabled
    logging: "on"
  notify: Reload ufw

# Remove legacy before-chain LOGs (logged allowed traffic → PSAD noise)
- name: Remove noisy before-chain iptables LOG hooks (IPv4)
  ansible.builtin.blockinfile:
    path: /etc/ufw/before.rules
    marker: "# {mark} NOWO IPTABLES LOGGING"
    state: absent
  notify: Reload ufw

- name: Remove noisy before-chain iptables LOG hooks (IPv6)
  ansible.builtin.blockinfile:
    path: /etc/ufw/before6.rules
    marker: "# {mark} NOWO IPTABLES LOGGING"
    state: absent
  notify: Reload ufw

# after-* only sees packets not ACCEPTed by user rules (denied / fall-through)
- name: Log non-accepted traffic on UFW after-chains for PSAD (IPv4)
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    insertbefore: "^COMMIT"
    marker: "# {mark} NOWO IPTABLES LOGGING"
    block: |
      # Rate-limited LOG for packets that reached after-* (not accepted earlier)
      -A ufw-after-input -m limit --limit 30/min --limit-burst 50 -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
      -A ufw-after-forward -m limit --limit 30/min --limit-burst 50 -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
  notify: Reload ufw

- name: Log non-accepted traffic on UFW after-chains for PSAD (IPv6)
  ansible.builtin.blockinfile:
    path: /etc/ufw/after6.rules
    insertbefore: "^COMMIT"
    marker: "# {mark} NOWO IPTABLES LOGGING"
    block: |
      -A ufw6-after-input -m limit --limit 30/min --limit-burst 50 -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
      -A ufw6-after-forward -m limit --limit 30/min --limit-burst 50 -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
  notify: Reload ufw

- name: Route firewall-tagged logs to a dedicated file
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/10-nowo-iptables.conf
    mode: "0644"
    content: |
      :msg, contains, "[IPTABLES] " /var/log/iptables.log
      & stop
      :msg, contains, "[UFW BLOCK] " /var/log/iptables.log
      & stop
  notify: Restart rsyslog

- name: Rotate dedicated iptables log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/nowo-iptables
    mode: "0644"
    content: |
      /var/log/iptables.log {
          daily
          rotate 7
          missingok
          notifempty
          compress
          delaycompress
          create 640 root adm
          postrotate
              /usr/lib/rsyslog/rsyslog-rotate >/dev/null 2>&1 || true
          endscript
      }

- name: Ensure iptables log file exists for PSAD
  ansible.builtin.file:
    path: /var/log/iptables.log
    state: touch
    mode: "0640"
    owner: root
    group: adm
    modification_time: preserve
    access_time: preserve

- name: Install Fail2Ban jail for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd-nowo.local
    mode: "0644"
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1 {{ harden_fail2ban_ignoreip | default('') }}
      bantime  = {{ harden_fail2ban_bantime }}
      findtime = 10m
      maxretry = {{ harden_fail2ban_maxretry }}
      destemail = {{ harden_mail_to }}
      sender = {{ harden_mail_from }}
      mta = mail
      action = %(action_mwl)s

      [sshd]
      enabled = true
      port = {{ harden_ssh_port }}
      backend = systemd
      banaction = ufw
  notify: Restart fail2ban

- name: Ensure Fail2Ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Configure PSAD basics
  when: harden_enable_psad | bool
  ansible.builtin.lineinfile:
    path: /etc/psad/psad.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^EMAIL_ADDRESSES', line: "EMAIL_ADDRESSES {{ harden_mail_to }};" }
    - { regexp: '^HOSTNAME', line: "HOSTNAME {{ ansible_hostname }};" }
    - { regexp: '^ENABLE_PSADWATCHD', line: "ENABLE_PSADWATCHD Y;" }
    - { regexp: '^ENABLE_AUTO_IDS ', line: "ENABLE_AUTO_IDS {{ 'Y' if harden_psad_auto_ids | bool else 'N' }};" }
    - { regexp: '^ENABLE_AUTO_IDS_EMAILS', line: "ENABLE_AUTO_IDS_EMAILS {{ 'Y' if harden_psad_auto_ids | bool else 'N' }};" }
    - { regexp: '^AUTO_IDS_DANGER_LEVEL', line: "AUTO_IDS_DANGER_LEVEL {{ harden_psad_danger_level }};" }
    - { regexp: '^EXPECT_TCP_OPTIONS', line: "EXPECT_TCP_OPTIONS Y;" }
    - { regexp: '^IPT_SYSLOG_FILE', line: "IPT_SYSLOG_FILE /var/log/iptables.log;" }
  notify: Restart psad

- name: Refresh PSAD signatures
  when: harden_enable_psad | bool
  ansible.builtin.command: psad --sig-update
  register: psad_sig
  changed_when: false
  failed_when: >-
    (harden_strict_ops | default(true) | bool) and (psad_sig.rc | default(1) != 0)
  check_mode: false

- name: Ensure PSAD is running
  when: harden_enable_psad | bool
  ansible.builtin.service:
    name: psad
    state: started
    enabled: true
