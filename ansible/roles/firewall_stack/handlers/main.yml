---
- name: Reload ufw
  ansible.builtin.shell: |
    set -euo pipefail
    if ufw status 2>/dev/null | head -n1 | grep -qi 'Status: active'; then
      ufw reload
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Restart psad
  ansible.builtin.service:
    name: psad
    state: restarted

- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
